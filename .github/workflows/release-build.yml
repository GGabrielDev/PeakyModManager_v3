name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    env:
      PMM_RELEASE_REPOSITORY: ${{ vars.PMM_RELEASE_REPOSITORY || github.repository }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux AppImage deb rpm --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Update version
        shell: bash
        run: |
          VERSION="${{ inputs.tag_name }}"
          if [[ $VERSION == v* ]]; then
            VERSION="${VERSION:1}"
          fi
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Build and Publish
        run: |
          npm run build
          npx electron-builder --config electron-builder.config.cjs ${{ matrix.args }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect Linux packages and generate Arch recipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
          node scripts/package-artifacts.cjs
          node scripts/build-lifecycle-previous.cjs
          node scripts/package-lifecycle.cjs

      - name: Upload lifecycle diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Linux-package-lifecycle
          path: smoke-results/

      - name: Publish verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
        run: |
          gh release view "$TAG" --repo "$PMM_RELEASE_REPOSITORY" || gh release create "$TAG" --repo "$PMM_RELEASE_REPOSITORY" --title "$TAG"
          if [[ "${{ runner.os }}" == Linux ]]; then
            gh release upload "$TAG" --repo "$PMM_RELEASE_REPOSITORY" dist/*.AppImage dist/*.deb dist/*.rpm dist/PKGBUILD dist/SHA256SUMS dist/package-evidence.json dist/latest-linux.yml
          else
            gh release upload "$TAG" --repo "$PMM_RELEASE_REPOSITORY" dist/*.exe dist/*.blockmap dist/latest.yml
          fi
