name: Build Linux (Artifact)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

jobs:
  build-linux:
    env:
      PMM_RELEASE_REPOSITORY: ${{ vars.PMM_RELEASE_REPOSITORY || github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Update version
        run: |
          VERSION="${{ inputs.tag_name }}"
          if [[ $VERSION == v* ]]; then
            VERSION="${VERSION:1}"
          fi
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Build Linux AppImage
        run: npx electron-builder --config electron-builder.config.cjs --linux AppImage deb rpm --x64 --publish=never

      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Inspect packages and generate pinned Arch recipe
        run: node scripts/package-artifacts.cjs

      - name: Build previous lifecycle fixture
        run: node scripts/build-lifecycle-previous.cjs

      - name: Exercise Debian, Fedora and Arch package lifecycle
        run: node scripts/package-lifecycle.cjs

      - name: Upload lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-package-lifecycle
          path: smoke-results/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Linux-x86_64
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/PKGBUILD
            dist/SHA256SUMS
            dist/package-evidence.json
            dist/latest-linux.yml
